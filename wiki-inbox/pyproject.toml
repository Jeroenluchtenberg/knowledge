[project]
name = "wiki-inbox"
version = "0.1.0"
description = "MCP server for reading, adding and archiving llm-wiki inbox files"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "mcp==2.3.0",
    "markitdown[pdf,docx,pptx,xlsx]==0.1.8",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
    "uvicorn==0.54.0",
]

[project.scripts]
wiki-inbox = "wiki_inbox.server:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "reportlab==5.0.1",
    "python-docx==1.2.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_inbox"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
