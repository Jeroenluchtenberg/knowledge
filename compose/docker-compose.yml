# Local test stack for the knowledge services.
#
#   cp .env.example .env && ../scripts/init-data.sh   # once
#   docker compose up -d                              # llm-wiki + wiki-inbox
#   docker compose --profile gateway up -d            # + agentgateway on :3000
#
# Production deployment (auth via agentgateway + Authentik) lives in the Ansible roles.

name: knowledge

x-app: &app
  user: "${UID:-1000}:${GID:-1000}"
  restart: unless-stopped
  networks: [knowledge]

services:
  llm-wiki:
    <<: *app
    build:
      context: ../llm-wiki
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        LLM_WIKI_VERSION: ${LLM_WIKI_VERSION:-1.0.1}
    image: ${LLM_WIKI_IMAGE:-knowledge/llm-wiki:1.0.1}
    environment:
      LLM_WIKI_BOOTSTRAP_WIKI: ${LLM_WIKI_BOOTSTRAP_WIKI:-main}
      LLM_WIKI_ALLOWED_HOSTS: localhost,127.0.0.1,llm-wiki,agentgateway
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-llm-wiki}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-llm-wiki@localhost}
    volumes:
      - ./data/wikis:/wikis
      - ./data/config:/config
    ports:
      - "127.0.0.1:${LLM_WIKI_PORT:-8080}:8080"

  wiki-inbox:
    <<: *app
    build:
      context: ../wiki-inbox
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: ${WIKI_INBOX_IMAGE:-knowledge/wiki-inbox:0.1.0}
    environment:
      INBOX_ALLOWED_HOSTS: localhost,127.0.0.1,wiki-inbox,agentgateway
      INBOX_FETCH_ALLOW_PRIVATE: ${INBOX_FETCH_ALLOW_PRIVATE:-false}
      INBOX_READ_ONLY: ${INBOX_READ_ONLY:-false}
    volumes:
      - ./data/wikis:/wikis
      - ./data/config:/config:ro
    depends_on:
      llm-wiki:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WIKI_INBOX_PORT:-8081}:8081"

  agentgateway:
    profiles: [gateway]
    image: ${AGENTGATEWAY_IMAGE:-ghcr.io/agentgateway/agentgateway:v1.6.0@sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c}
    command: ["-f", "/config/config.yaml"]
    restart: unless-stopped
    networks: [knowledge]
    volumes:
      - ./agentgateway/config.yaml:/config/config.yaml:ro
    depends_on:
      llm-wiki:
        condition: service_healthy
      wiki-inbox:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AGENTGATEWAY_PORT:-3000}:3000"

networks:
  knowledge:
    name: knowledge
