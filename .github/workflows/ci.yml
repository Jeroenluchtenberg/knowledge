name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  wiki-inbox:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wiki-inbox
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q

  skills:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No local-filesystem or CLI instructions outside bootstrap
        run: |
          if grep -rnE "wiki_resolve|file tools|\bmv\b|llm-wiki [a-z]|Edit/Write|\bRead/Write\b|Bash" \
               skills/*/SKILL.md skills/*/references/ | grep -v '^skills/bootstrap/'; then
            echo "::error::skills reference local file tools or the llm-wiki CLI"; exit 1
          fi

  images:
    runs-on: ubuntu-24.04
    needs: [wiki-inbox]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
      - name: Build wiki-inbox
        uses: docker/build-push-action@v6
        with:
          context: wiki-inbox
          push: false
          load: true
          tags: knowledge/wiki-inbox:0.1.0
          cache-from: type=gha,scope=wiki-inbox
          cache-to: type=gha,mode=max,scope=wiki-inbox
      - name: Build llm-wiki
        uses: docker/build-push-action@v6
        with:
          context: llm-wiki
          push: false
          load: true
          tags: knowledge/llm-wiki:1.0.1
          cache-from: type=gha,scope=llm-wiki
          cache-to: type=gha,mode=max,scope=llm-wiki
      - name: Smoke test
        run: |
          cp compose/.env.example compose/.env
          sed -i "s/^UID=.*/UID=$(id -u)/; s/^GID=.*/GID=$(id -g)/" compose/.env
          scripts/init-data.sh
          docker compose --project-directory compose -f compose/docker-compose.yml --profile gateway up -d --wait
          uv run scripts/smoke_test.py --url-fixture ''
          uv run scripts/smoke_test.py --gateway --url-fixture ''
      - name: Logs on failure
        if: failure()
        run: docker compose --project-directory compose -f compose/docker-compose.yml --profile gateway logs

  # Publish both images to GHCR after a push to main, once tests and the
  # smoke test have passed. Tags: the component version (moving, e.g.
  # `1.0.1`), `sha-<short>` (immutable) and `latest`.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: [wiki-inbox, skills, images]
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-images
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - name: llm-wiki
            version_cmd: sed -n 's/^ARG LLM_WIKI_VERSION=//p' llm-wiki/Dockerfile | head -n1
          - name: wiki-inbox
            version_cmd: sed -n 's/^version = "\(.*\)"/\1/p' wiki-inbox/pyproject.toml
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Component version
        id: version
        run: echo "version=$(${{ matrix.version_cmd }})" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.name }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
